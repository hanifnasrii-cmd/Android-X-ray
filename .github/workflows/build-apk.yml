name: Build ANDROID X-RAY APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Generate Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "ANDROID X-RAY" "io.xray.workstation" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android 11-16 Safe-Area Insets & Status Bar
        run: |
          cat << 'EOF' > android/app/src/main/java/io/xray/workstation/MainActivity.java
          package io.xray.workstation;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#1C1F18"));
                  getWindow().setNavigationBarColor(Color.parseColor("#1C1F18"));
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }
                  View content = findViewById(android.R.id.content);
                  if (content != null) {
                      content.setBackgroundColor(Color.parseColor("#1C1F18"));
                      ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                          Insets bars = windowInsets.getInsets(
                              WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout()
                          );
                          v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      });
                      ViewCompat.requestApplyInsets(content);
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-xray-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (on manual run or tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ANDROID X-RAY Build #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
